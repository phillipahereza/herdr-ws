id = "fuzzy-jump"
name = "Fuzzy Jump"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Fuzzy-jump to workspaces, tabs (@), agents (!) and zoxide dirs (/)"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[panes]]
id = "picker"
title = "Jump"
placement = "popup"
width = "70%"
height = 30
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-ws\""]

[[actions]]
id = "open"
title = "Fuzzy jump to workspace/tab"
command = ["herdr", "plugin", "pane", "open", "--plugin", "fuzzy-jump", "--entrypoint", "picker", "--focus"]

# Focus history for recent-first ordering.
[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-ws\" record"]

[[events]]
on = "tab.focused"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-ws\" record"]
